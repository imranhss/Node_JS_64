<div class="container mt-4">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Add User</h4>
        </div>
        <div class="card-body">
            <form [formGroup]="userForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">

                <!-- Receiver Info -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Name</label>
                        <input type="text" formControlName="name" class="form-control" placeholder="Receiver Name">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" formControlName="email" class="form-control">
                    </div>
                    <div class="col-md-6 mt-3">
                        <label class="form-label">Password</label>
                        <input type="password" formControlName="password" class="form-control">
                    </div>
                    <div class="col-md-6 mt-3">
                        <label class="form-label">Phone</label>
                        <input type="text" formControlName="phone" class="form-control">
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">User Picture</label>
                        <input type="file" class="form-control" (change)="onFileChange($event)" accept="image/*">
                    </div>
                </div>







                <!-- Submit -->
                <div class="d-grid">
                    <button class="btn btn-success" type="submit">Submit </button>
                </div>
            </form>

            <div *ngIf="message" class="alert mt-3" [ngClass]="{
        'alert-success': message.includes('successfully'),
        'alert-danger': message.includes('Failed')
      }">
                {{ message }}
            </div>
        </div>
    </div>
</div>
